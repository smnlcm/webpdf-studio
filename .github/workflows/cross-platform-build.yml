name: WebPDF Studio cross-platform build

on:
  pull_request:
    paths:
      - "cross-platform/**"
      - ".github/workflows/cross-platform-build.yml"
  workflow_dispatch:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch: x64
            artifact: webpdf-windows-x64
          - label: macOS Intel
            os: macos-latest
            arch: x64
            artifact: webpdf-macos-intel
          - label: macOS Apple Silicon
            os: macos-latest
            arch: arm64
            artifact: webpdf-macos-apple-silicon
          - label: Linux x64
            os: ubuntu-latest
            arch: x64
            artifact: webpdf-linux-x64

    defaults:
      run:
        working-directory: cross-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Install dependencies
        run: npm ci

      - name: Download Electron and configure its Linux sandbox
        if: runner.os == 'Linux'
        run: |
          node node_modules/electron/install.js
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Validate source
        run: npm run check

      - name: Smoke test on Windows
        if: runner.os == 'Windows'
        run: npm run smoke

      - name: Smoke test on macOS
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: npm run smoke

      - name: Smoke test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke

      - name: Create packages
        run: npm run make -- --arch=${{ matrix.arch }}

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: cross-platform/out/make/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v3.')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "WebPDF Studio $GITHUB_REF_NAME" \
            --generate-notes
