name: Build All Platforms
on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd cross-platform && npm install
      - run: cd cross-platform && npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: WebPDF-${{ matrix.os }}
          path: cross-platform/dist/*
